function saveTx() {
  const da = document.getElementById('f-date');
  const am = document.getElementById('f-amt');
  const no = document.getElementById('f-note');
  const de = document.getElementById('f-desc');
  if (da) fDate = da.value;
  if (am) {
    const raw = (am.textContent || am.value || '').replace(/,/g, '');
    const evaluated = evalAmount(raw);
    fAmount = evaluated !== null ? String(evaluated) : raw;
    if (am.tagName === 'SPAN') am.textContent = fAmount;
    else am.value = fAmount;
  }
  if (no) fNote = no.value;
  if (de) fDescription = de.value;

  if (!fAmount || isNaN(Number(fAmount)) || Number(fAmount) <= 0) {
    toast('Enter a valid amount'); return;
  }
  if (!fDate) { toast('Select a date'); return; }
  if (!fCat) { toast('Pick a category'); return; }

  const amount = parseFloat(Number(fAmount).toFixed(2));

  if (fMode === 'add') {
    let txDate = fDate;

    // For end of month, snap to last day of selected month
    if (fRepeat === 'endofmonth') {
      const { y, m } = parseDate(fDate);
      txDate = lastDayOfMonth(y, m);
    }

    const tx = {
      id: uid(), date: txDate, amount,
      category: fCat, note: fNote.trim(),
      description: fDescription.trim(), photo: fPhoto,
      createdAt: new Date().toISOString(), recurringId: null,
    };

    if (fRepeat !== 'none') {
      const rule = {
        id: uid(), amount, category: fCat, note: fNote.trim(),
        frequency: fRepeat, startDate: txDate, lastGenerated: txDate,
      };
      data.recurring.push(rule);
      tx.recurringId = rule.id;
    }

    data.transactions.push(tx);
    save();
    toast('Expense added ✓');

  } else {
    const tx = data.transactions.find(t => t.id === fEditId);
    if (tx) {
      tx.date = fDate; tx.amount = amount;
      tx.category = fCat; tx.note = fNote.trim();
      tx.description = fDescription.trim(); tx.photo = fPhoto;
      if (tx.recurringId) {
        const rule = data.recurring.find(r => r.id === tx.recurringId);
        if (rule) { rule.note = fNote.trim(); rule.amount = amount; rule.category = fCat; }
      } else if (fRepeat !== 'none') {
        const rule = {
          id: uid(), amount, category: fCat, note: fNote.trim(),
          frequency: fRepeat, startDate: tx.date, lastGenerated: tx.date,
        };
        data.recurring.push(rule);
        tx.recurringId = rule.id;
      }
      save();
      toast('Updated ✓');
    }
  }

  if (view === 'add') {
    view = addViewPrev;
    render();
  } else {
    closeAllSheets();
    render();
  }
}

function deleteTx() {
  if (fMode === 'add') { closeAddView(); return; }
  const msg = fIsRecurring ? 'Delete this expense and stop the recurring rule?' : 'Delete this expense?';
  if (!confirm(msg)) return;
  const tx = data.transactions.find(t => t.id === fEditId);
  const recurringId = tx?.recurringId;
  data.transactions = data.transactions.filter(t => t.id !== fEditId);
  if (recurringId) {
    const today = todayStr();
    data.transactions = data.transactions.filter(t => !(t.recurringId === recurringId && t.date > today));
    data.recurring = data.recurring.filter(r => r.id !== recurringId);
    save();
    toast('Expense and recurring rule deleted');
  } else {
    save();
    toast('Deleted');
  }
  if (view === 'add') {
    view = addViewPrev;
    render();
  } else {
    closeAllSheets();
    render();
  }
}

function saveRuleEdit() {
  const amt = ruleEditCents / 100;
  if (!amt || amt <= 0) { toast('Enter a valid amount'); return; }
  const r = data.recurring.find(x => x.id === ruleEditId);
  if (!r) return;
  const freqChanged = r.frequency !== ruleEditFreq;
  r.note      = ruleEditNote.trim();
  r.amount    = amt;
  r.frequency = ruleEditFreq;
  const today = todayStr();
  data.transactions
    .filter(t => t.recurringId === ruleEditId && t.date >= today)
    .forEach(t => { t.note = r.note; t.amount = r.amount; });
  if (freqChanged) {
    data.transactions = data.transactions.filter(t => !(t.recurringId === ruleEditId && t.date > today));
    r.lastGenerated = today;
    generateRecurring();
  }
  save();
  closeRecurringSheet();
  renderContent();
  toast('Rule updated');
}

function ruleCalcInput(ch) {
  if (ch === '00') ruleEditCents = Math.min(ruleEditCents * 100, 9999999);
  else ruleEditCents = Math.min(ruleEditCents * 10 + parseInt(ch), 9999999);
  const el = document.getElementById('rule-amt-display');
  if (el) el.textContent = 'RM ' + centsToStr(ruleEditCents);
}

function ruleCalcBack() {
  ruleEditCents = Math.floor(ruleEditCents / 10);
  const el = document.getElementById('rule-amt-display');
  if (el) el.textContent = 'RM ' + centsToStr(ruleEditCents);
}

  document.getElementById('cat-sheet').classList.add('show');
}

function closeCatNew() {
  catAddMode = false;
  newCatLabel = '';
  document.getElementById('cat-sheet').classList.remove('show');
  document.getElementById('overlay').classList.remove('show');
  subSheet = null;
  // Return to inline cat panel
  openCatPanel();
}

function renderCatSheet() {
  // Only used for the "New Category" name-entry form inside #cat-sheet
  document.getElementById('cat-header').innerHTML = `
    <button class="cat-back-btn" onclick="closeCatNew()">
      <svg width="8" height="14" viewBox="0 0 8 14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="7 1 1 7 7 13"/></svg>
      Back
    </button>
    <span class="sheet-title">New Category</span>
    <div style="width:48px"></div>`;
  document.getElementById('cat-body').innerHTML = `
    <div class="cat-new-form">
      <input type="text" class="cat-new-input" id="new-cat-name"
        placeholder="Category Name" value="${escAttr(newCatLabel)}"
        oninput="newCatLabel=this.value" autocomplete="off">
      <button class="cat-new-save-btn" onclick="saveCustomCat()">Save</button>
    </div>`;
  document.getElementById('new-cat-name')?.focus();
}

function saveCustomCat() {
  const nameEl = document.getElementById('new-cat-name');
  const label  = (nameEl?.value || newCatLabel).trim();
  if (!label) { toast('Enter a category name'); return; }

  const color = CAT_COLORS[data.customCats.length % CAT_COLORS.length];
  const key   = 'custom_' + uid();
  data.customCats.push({ key, label, emoji: '⭐', color });
  save();

  catAddMode  = false;
  newCatLabel = '';
  // Close the name-entry sheet and return to inline cat panel
  document.getElementById('cat-sheet').classList.remove('show');
  document.getElementById('overlay').classList.remove('show');
  subSheet = null;
  activePanel = 'cat';
  const catEl = document.getElementById('cat-inner');
  if (catEl) { renderCatInner(); catEl.style.display = 'block'; }
  const calcEl = document.getElementById('calc-inner');
  if (calcEl) calcEl.style.display = 'none';
  toast('Category added ✓');
}

// ── Photo functions ───────────────────────────────────────────────────────────

function openPhotoAction() {
  document.getElementById('photo-action').classList.add('show');
}

function closePhotoAction() {
  document.getElementById('photo-action').classList.remove('show');
}

function triggerCamera() {
  closePhotoAction();
  document.getElementById('input-camera').click();
}

function triggerGallery() {
  closePhotoAction();
  document.getElementById('input-gallery').click();
}

function handlePhoto(input) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    compressImage(e.target.result, compressed => {
      fPhoto = compressed;
      renderContent();
    });
  };
  reader.readAsDataURL(file);
  input.value = '';
}

function compressImage(dataUrl, callback) {
  const img = new Image();
  img.onload = () => {
    const MAX = 800;
    let { width, height } = img;
    if (width > MAX || height > MAX) {
      if (width > height) { height = Math.round(height * MAX / width); width = MAX; }
      else { width = Math.round(width * MAX / height); height = MAX; }
    }
    const canvas = document.createElement('canvas');
    canvas.width = width; canvas.height = height;
    canvas.getContext('2d').drawImage(img, 0, 0, width, height);
    callback(canvas.toDataURL('image/jpeg', 0.7));
  };
  img.src = dataUrl;
}

function clearPhoto() {
  fPhoto = null;
  renderContent();
}

// ── Sheet helpers ─────────────────────────────────────────────────────────────

function showSheet(id) {
  document.getElementById('overlay').classList.add('show');
  document.getElementById(id).classList.add('show');
}

function hideSheet(id) {
  document.getElementById(id).classList.remove('show');
}

function closeAllSheets() {
  document.getElementById('overlay').classList.remove('show');
  ['add-sheet','repeat-sheet','recurring-sheet','cat-sheet'].forEach(hideSheet);
  subSheet = null;
  closeCalc();
}

function overlayClick() {
  if (subSheet === 'repeat') {
    closeRepeatSheet();
    // In add-page view, overlay was shown for the sub-sheet — hide it
    if (view === 'add') document.getElementById('overlay').classList.remove('show');
  }
  else if (subSheet === 'recurring') { closeRecurringSheet(); document.getElementById('overlay').classList.remove('show'); }
  else if (subSheet === 'cat') { closeCatSheet(); }
  else if (view !== 'add') { closeAllSheets(); }
}

// ── Toast ─────────────────────────────────────────────────────────────────────

let toastTimer = null;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2200);
}

// ── Calculator keyboard ───────────────────────────────────────────────────────

let calcCents     = 0;    // current right operand in integer cents
let calcLeftCents = null; // left operand when operator is pending
let calcOp        = null; // '+' | '-' | '*' | '/' | null
let calcIntMode   = false; // true after × or ÷: digits enter as whole numbers, not cents
let activePanel = null; // 'calc' | 'cat' | null

function openCalc() {
  calcCents     = Math.round((parseFloat(fAmount) || 0) * 100);
  calcLeftCents = null;
  calcOp        = null;
  calcIntMode   = false;
  activePanel   = 'calc';
  const calcEl = document.getElementById('calc-inner');
  const catEl  = document.getElementById('cat-inner');
  if (calcEl) {
    if (catEl) catEl.style.display = 'none';
    calcEl.style.display = 'block';
    updateCalcDisplay();
  }
}

function closeCalc() {
  activePanel = null;
  const calcEl = document.getElementById('calc-inner');
  if (calcEl) calcEl.style.display = 'none';
}

function openCatPanel() {
  activePanel = 'cat';
  const calcEl = document.getElementById('calc-inner');
  const catEl  = document.getElementById('cat-inner');
  if (calcEl) calcEl.style.display = 'none';
  if (catEl)  {
    renderCatInner();
    catEl.style.display = 'block';
  }
}

function renderCatInner() {
  const catEl = document.getElementById('cat-inner');
  if (!catEl) return;
  const cats = getAllCats().filter(c => c.key !== 'other');
  const usedKeys = new Set(data.transactions.map(t => t.category));
  let html = `<div class="cat-grid" style="padding:8px 10px 10px;gap:5px">`;
  for (const c of cats) {
    const canDelete = !usedKeys.has(c.key);
    html += `<div class="cat-item${c.key===fCat?' sel':''}" onclick="pickCatInline('${c.key}')">
      <span class="cat-emo">${c.emoji}</span>
      <span class="cat-nm">${esc(c.label)}</span>
      ${canDelete ? `<button class="cat-item-del" onclick="event.stopPropagation();deleteCatInline('${c.key}')">✕</button>` : ''}
    </div>`;
  }
  html += `<div class="cat-item cat-add-tile" onclick="openCatNew()">
    <span class="cat-emo">+</span>
    <span class="cat-nm">Add</span>
  </div></div>`;
  catEl.innerHTML = html;
}

function pickCatInline(key) {
  fCat = key;
  activePanel = null;
  const catEl  = document.getElementById('cat-inner');
  const calcEl = document.getElementById('calc-inner');
  if (catEl)  catEl.style.display  = 'none';
  if (calcEl) calcEl.style.display = 'none';
  // Rebuild category row to show new selection
  renderContent();
}

function deleteCatInline(key) {
  if (!confirm('Remove this category?')) return;
  const isCustom = !CATS.find(c => c.key === key);
  if (isCustom) {
    data.customCats = data.customCats.filter(c => c.key !== key);
  } else {
    data.hiddenCats = [...(data.hiddenCats || []), key];
  }
  save();
  if (fCat === key) fCat = '';
  renderCatInner();
}

function initPanel() {
  if (activePanel === 'calc') {
    const el = document.getElementById('calc-inner');
    if (el) { el.style.display = 'block'; updateCalcDisplay(); }
  } else if (activePanel === 'cat') {
    const el = document.getElementById('cat-inner');
    if (el) { renderCatInner(); el.style.display = 'block'; }
  }
}

function centsToStr(c) {
  return (c / 100).toLocaleString('en-MY', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

function applyOpCents(left, op, right) {
  const l = left / 100, r = right / 100;
  const result = op === '+' ? l + r : op === '-' ? l - r : op === '*' ? l * r : r !== 0 ? l / r : l;
  return Math.round(Math.max(0, result) * 100);
}

function updateCalcDisplay() {
  const el = document.getElementById('f-amt');
  if (el) el.textContent = calcCents > 0 ? centsToStr(calcCents) : '0.00';
  fAmount = (calcCents / 100).toFixed(2);
  const preview = document.getElementById('calc-preview');
  if (!preview) return;
  if (calcOp !== null) {
    const sym = { '+': '+', '-': '−', '*': '×', '/': '÷' }[calcOp];
    preview.textContent = calcCents > 0
      ? centsToStr(calcLeftCents) + ' ' + sym + ' ' + centsToStr(calcCents) + ' = ' + centsToStr(applyOpCents(calcLeftCents, calcOp, calcCents))
      : centsToStr(calcLeftCents) + ' ' + sym + ' ...';
  } else {
    preview.textContent = '';
  }
}

function calcInput(ch) {
  if (['+', '-', '*', '/'].includes(ch)) {
    if (calcOp !== null) calcCents = applyOpCents(calcLeftCents, calcOp, calcCents);
    calcLeftCents = calcCents;
    calcOp = ch;
    calcCents = 0;
    calcIntMode = (ch === '*' || ch === '/');
  } else if (ch === '00') {
    calcCents = Math.min(calcCents * 100, 999999999);
  } else if (/\d/.test(ch)) {
    if (calcIntMode && calcOp !== null) {
      // Integer-first mode for × and ÷: pressing 2 gives 2.00, not 0.02
      calcCents = Math.min(calcCents * 10 + parseInt(ch) * 100, 999999999);
    } else {
      calcCents = Math.min(calcCents * 10 + parseInt(ch), 999999999);
    }
  }
  updateCalcDisplay();
}

function calcBack() {
  if (calcCents === 0 && calcOp !== null) {
    calcCents = calcLeftCents;
    calcLeftCents = null;
    calcOp = null;
    calcIntMode = false;
  } else if (calcIntMode && calcOp !== null) {
    // Remove last whole digit: 23.00 → 2.00 → 0 (then next back cancels operator)
    calcCents = Math.floor(Math.floor(calcCents / 100) / 10) * 100;
  } else {
    calcCents = Math.floor(calcCents / 10);
  }
  updateCalcDisplay();
}

function calcAC() {
  calcCents = 0;
  calcIntMode = false;
  updateCalcDisplay();
}

function calcEqual() {
  if (calcOp !== null) {
    calcCents = applyOpCents(calcLeftCents, calcOp, calcCents);
    calcLeftCents = null;
    calcOp = null;
  }
  calcIntMode = false;
  updateCalcDisplay();
}

function calcOK() {
  calcEqual();
  closeCalc();
}

// ── Init ──────────────────────────────────────────────────────────────────────

load();
render();
initContentSwipe();
</script>
