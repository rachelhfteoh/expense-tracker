<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Expenses">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <title>Expense Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #f4f4f7;
      --card: #ffffff;
      --expense: #ef4444;
      --expense-soft: #fef2f2;
      --today-bg: #1e293b;
      --text: #111827;
      --text-2: #6b7280;
      --text-3: #9ca3af;
      --border: #e5e7eb;
      --nav-h: 60px;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    html, body {
      height: 100%;
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
    }

    #app {
      position: fixed;
      top: 0;
      bottom: 0;
      left: 0;
      right: 0;
      display: flex;
      flex-direction: column;
      width: 100%;
      max-width: 430px;
      margin: 0 auto;
      overflow: hidden;
      background: var(--bg);
    }

    /* ── Header ── */
    #header {
      background: var(--card);
      padding-top: var(--safe-top);
      flex-shrink: 0;
      border-bottom: 1px solid var(--border);
    }

    .header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 20px 10px;
    }

    .header-title {
      font-size: 18px;
      font-weight: 800;
      color: var(--text);
    }

    .header-action {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-3);
      font-family: inherit;
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 4px 8px;
      border-radius: 8px;
    }
    .header-action:active { background: var(--bg); }

    .month-nav {
      display: flex;
      align-items: center;
      padding: 6px 16px 12px;
      gap: 8px;
    }

    .mnav-btn {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background: var(--bg);
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-2);
      flex-shrink: 0;
    }
    .mnav-btn:active { background: #e5e7eb; }

    .month-label {
      flex: 1;
      text-align: center;
      font-size: 15px;
      font-weight: 700;
      color: var(--text);
    }

    /* ── Summary bar ── */
    .summary-bar {
      display: flex;
      background: var(--card);
      border-bottom: 1px solid var(--border);
      padding: 10px 0;
    }

    .sum-item {
      flex: 1;
      text-align: center;
      padding: 0 8px;
    }

    .sum-item + .sum-item {
      border-left: 1px solid var(--border);
    }

    .sum-label {
      font-size: 10px;
      font-weight: 600;
      color: var(--text-3);
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }

    .sum-value {
      font-size: 15px;
      font-weight: 700;
      margin-top: 2px;
      color: var(--text);
    }

    .sum-value.red { color: var(--expense); }

    /* ── Content ── */
    #content {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior-y: contain;
    }

    /* ── Transaction list ── */
    .day-group { }

    .day-header {
      display: flex;
      align-items: center;
      padding: 10px 20px 6px;
      gap: 6px;
    }

    .day-num {
      font-size: 15px;
      font-weight: 800;
      color: var(--text);
    }

    .day-tag {
      font-size: 11px;
      font-weight: 600;
      color: #fff;
      background: #94a3b8;
      padding: 1px 6px;
      border-radius: 4px;
    }

    .day-total {
      margin-left: auto;
      font-size: 13px;
      font-weight: 700;
      color: #111827;
    }

    .tx-card {
      background: var(--card);
      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      margin-bottom: 0;
    }

    .tx-row-wrap {
      position: relative;
      overflow: hidden;
      touch-action: pan-y;
    }
    .tx-row-wrap:last-child .tx-row { border-bottom: none; }
    .tx-swipe-del {
      position: absolute;
      right: 0;
      top: 0;
      bottom: 0;
      width: 76px;
      background: #ef4444;
      color: #fff;
      border: none;
      font-size: 13px;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      -webkit-tap-highlight-color: transparent;
    }
    .tx-swipe-del:active { background: #dc2626; }

    .tx-row {
      display: flex;
      align-items: center;
      padding: 10px 16px;
      gap: 12px;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      background: var(--card);
      position: relative;
      will-change: transform;
    }
    .tx-row:active { background: #fafafa; }

    .tx-icon {
      width: 32px;
      height: 32px;
      border-radius: 9px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      flex-shrink: 0;
    }

    .tx-left {
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: 7px;
      flex-shrink: 0;
      width: 120px;
    }

    .tx-info { flex: 1; min-width: 0; }

    .tx-note {
      font-size: 12px;
      font-weight: 600;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .tx-cat {
      font-size: 12px;
      color: #6b7280;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .tx-right {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 2px;
      flex-shrink: 0;
    }

    .tx-amount {
      font-size: 12px;
      font-weight: 700;
      color: #111827;
      white-space: nowrap;
    }

    .tx-recur-badge {
      font-size: 10px;
      color: var(--text-3);
    }

    /* ── Week strip ── */
    .week-strip {
      display: grid;
      grid-template-columns: 24px repeat(7, 1fr) 24px;
      gap: 3px;
      background: rgba(255,255,255,0.82);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.95);
      border-radius: 18px;
      padding: 10px 6px 8px;
      margin: 0 16px 12px;
      box-shadow: 0 2px 12px rgba(124,58,237,0.08);
      user-select: none;
      touch-action: pan-y;
    }
    .ws-cell {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      cursor: pointer;
    }
    .ws-cell.future { cursor: default; }
    .ws-nav-btn {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 17px;
      color: #9ca3af;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      border-radius: 8px;
      align-self: center;
    }
    .ws-nav-btn:disabled { opacity: 0.2; cursor: default; }
    .ws-nav-btn:not(:disabled):active { color: #7c3aed; }
    .ws-label {
      font-size: 10px;
      font-weight: 800;
      color: #9ca3af;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }
    .ws-dot {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 600;
    }
    .ws-dot.today {
      background: linear-gradient(135deg, #7c3aed, #6366f1);
      color: #fff;
      font-weight: 900;
      box-shadow: 0 3px 10px rgba(124,58,237,0.38);
    }
    .ws-dot.past   { background: #f3f4f6; color: #6b7280; }
    .ws-dot.future { background: #f9fafb; color: #d1d5db; }
    .ws-dot.selected:not(.today) { background: #ede9fe; color: #7c3aed; font-weight: 800; }
    .ws-exp-dot {
      width: 4px; height: 4px;
      border-radius: 50%;
      background: #ef4444;
    }
    .ws-exp-dot.hidden { visibility: hidden; }

    /* ── Empty state ── */
    .empty {
      padding: 64px 20px;
      text-align: center;
    }
    .empty-ico { font-size: 52px; }
    .empty-title { font-size: 16px; font-weight: 700; color: var(--text-2); margin-top: 12px; }
    .empty-sub { font-size: 13px; color: var(--text-3); margin-top: 4px; }

    /* ── FAB ── */
    #fab {
      position: fixed;
      bottom: calc(var(--nav-h) + var(--safe-bottom) + 16px);
      right: calc(24px + env(safe-area-inset-right));
      width: 50px;
      height: 50px;
      border-radius: 25px;
      background: var(--expense);
      color: #fff;
      border: none;
      cursor: pointer;
      box-shadow: 0 4px 18px rgba(239,68,68,0.38);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 50;
      -webkit-tap-highlight-color: transparent;
      transition: transform 0.15s;
    }
    #fab:active { transform: scale(0.94); }

    /* ── Bottom Nav ── */
    #nav {
      background: var(--card);
      border-top: 1px solid var(--border);
      display: flex;
      padding-bottom: env(safe-area-inset-bottom, 0px);
      flex-shrink: 0;
      height: calc(60px + env(safe-area-inset-bottom, 0px));
    }

    .nav-btn {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      background: none;
      border: none;
      cursor: pointer;
      padding: 8px 0;
      -webkit-tap-highlight-color: transparent;
    }

    .nav-ico { width: 22px; height: 22px; color: var(--text-3); }
    .nav-lbl { font-size: 10px; font-weight: 600; color: var(--text-3); font-family: inherit; }
    .nav-btn.active .nav-ico { color: var(--expense); }
    .nav-btn.active .nav-lbl { color: var(--expense); }

    /* ── Calendar ── */
    .cal-week-header {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      background: var(--card);
      border-bottom: 1px solid var(--border);
    }

    .cal-wday {
      text-align: center;
      padding: 8px 0;
      font-size: 11px;
      font-weight: 700;
      color: var(--text-3);
    }
    .cal-wday:first-child { color: var(--expense); }
    .cal-wday:last-child { color: #3b82f6; }

    .cal-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      background: var(--card);
    }

    .cal-cell {
      min-height: 58px;
      border-bottom: 1px solid var(--border);
      border-right: 1px solid var(--border);
      padding: 5px 3px 3px;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .cal-cell:nth-child(7n) { border-right: none; }
    .cal-cell:active { background: #f9fafb; }
    .cal-cell.other-month { background: #fafafa; }
    .cal-cell.other-month .cal-cnum { color: #d1d5db; }

    .cal-cnum-wrap {
      width: 26px;
      height: 26px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 7px;
      flex-shrink: 0;
    }

    .cal-cnum {
      font-size: 13px;
      font-weight: 500;
      color: var(--text);
      line-height: 1;
    }

    /* Sunday = col 1: nth-child(7n+1) */
    .cal-cell:nth-child(7n+1) .cal-cnum { color: #ef4444; }
    /* Saturday = col 7: nth-child(7n) */
    .cal-cell:nth-child(7n) .cal-cnum { color: #3b82f6; }

    .cal-cell.is-today .cal-cnum-wrap { background: var(--today-bg); }
    .cal-cell.is-today .cal-cnum { color: #fff !important; font-weight: 700; }

    .cal-cell.is-selected:not(.is-today) .cal-cnum-wrap { background: #ede9fe; }
    .cal-cell.is-selected:not(.is-today) .cal-cnum { color: #7c3aed !important; font-weight: 700; }

    .cal-day-amt {
      font-size: 9px;
      font-weight: 700;
      color: #111827;
      margin-top: 3px;
      text-align: center;
      width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* Selected day panel */
    .cal-day-panel {
      background: var(--card);
      border-top: 2px solid var(--border);
    }

    .cal-day-panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 20px 8px;
    }

    .cal-day-panel-label {
      font-size: 14px;
      font-weight: 700;
      color: var(--text);
    }

    .cal-day-panel-total {
      font-size: 13px;
      font-weight: 700;
      color: #111827;
    }

    .cal-add-btn {
      width: 36px;
      height: 36px;
      border-radius: 18px;
      background: var(--expense);
      color: #fff;
      border: none;
      font-size: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    /* ── Stats ── */
    .stats-chart-section {
      background: var(--card);
      border-bottom: 1px solid var(--border);
      padding: 24px 20px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .stats-total-label {
      font-size: 13px;
      color: var(--text-3);
      font-weight: 500;
    }

    .stats-total-value {
      font-size: 22px;
      font-weight: 800;
      color: var(--expense);
    }

    .stats-cat-list { background: var(--card); }

    .cd-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 16px;
      border-bottom: 1px solid rgba(0,0,0,0.05);
      cursor: pointer;
      gap: 12px;
    }
    .cd-row:last-child { border-bottom: none; }
    .cd-row:active { background: rgba(124,58,237,0.05); }
    .cd-note {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      font-weight: 500;
      color: #111827;
      flex: 1;
      min-width: 0;
    }
    .cd-note span:first-child {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .cd-row .tx-amount { font-size: 12px; }

    .stats-cat-row {
      display: flex;
      align-items: center;
      padding: 11px 20px;
      gap: 10px;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
    }
    .stats-cat-row:active { background: rgba(124,58,237,0.06); }

    .stats-dot {
      width: 10px;
      height: 10px;
      border-radius: 5px;
      flex-shrink: 0;
    }

    .stats-cat-emoji { font-size: 18px; flex-shrink: 0; }

    .stats-cat-name {
      flex: 1;
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
      min-width: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .stats-bar-wrap {
      width: 64px;
      height: 6px;
      background: #e5e7eb;
      border-radius: 3px;
      overflow: hidden;
      flex-shrink: 0;
    }

    .stats-bar { height: 100%; border-radius: 3px; }

    .stats-pct {
      font-size: 11px;
      font-weight: 700;
      color: var(--text-3);
      width: 44px;
      text-align: right;
      flex-shrink: 0;
    }

    .stats-amt {
      font-size: 13px;
      font-weight: 700;
      color: var(--text);
      white-space: nowrap;
      flex-shrink: 0;
      width: 110px;
      text-align: right;
    }

    /* ── Overlay ── */
    #overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.42);
      z-index: 200;
      display: none;
    }
    #overlay.show { display: block; }

    /* ── Sheets ── */
    .sheet {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%) translateY(102%);
      width: 100%;
      max-width: 430px;
      background: var(--card);
      border-radius: 22px 22px 0 0;
      z-index: 300;
      transition: transform 0.3s cubic-bezier(0.32, 0.72, 0, 1);
      max-height: 92vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .sheet.show { transform: translateX(-50%) translateY(0); }

    /* Repeat sheet stacks above add sheet */
    #repeat-sheet { z-index: 400; }
    #recurring-sheet { z-index: 400; }

    .sheet-handle {
      width: 36px;
      height: 4px;
      background: #d1d5db;
      border-radius: 2px;
      margin: 12px auto 0;
      flex-shrink: 0;
    }

    .sheet-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 20px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .sheet-title { font-size: 16px; font-weight: 700; }

    .sheet-x {
      width: 36px;
      height: 36px;
      border-radius: 18px;
      background: #f3f4f6;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-2);
      flex-shrink: 0;
    }

    .sheet-body {
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      flex: 1;
      padding-bottom: calc(var(--safe-bottom) + 12px);
    }

    /* Form rows */
    .form-row {
      display: flex;
      align-items: center;
      height: 44px;
      padding: 0 20px;
      border-bottom: 1px solid var(--border);
      gap: 12px;
      box-sizing: border-box;
    }

    .form-lbl {
      font-size: 13px;
      color: var(--text-3);
      font-weight: 500;
      width: 68px;
      flex-shrink: 0;
    }

    .form-input {
      flex: 1;
      font-size: 16px;
      font-weight: 600;
      color: var(--text);
      background: none;
      border: none;
      outline: none;
      font-family: inherit;
      text-align: left;
    }
    .form-input::placeholder { color: #d1d5db; font-weight: 400; }

    input[type="date"].form-input {
      -webkit-appearance: none;
      text-align: left;
      display: block;
    }

    .amount-input { font-size: 16px; font-weight: 600; }

    .repeat-trigger {
      display: flex;
      align-items: center;
      justify-content: center;
      background: none;
      border: 1px solid var(--border);
      border-radius: 10px;
      cursor: pointer;
      width: 34px;
      height: 34px;
      color: var(--text-3);
      flex-shrink: 0;
    }
    .repeat-trigger.on { color: var(--expense); border-color: #fca5a5; background: var(--expense-soft); }
    .repeat-trigger:active { opacity: 0.8; }
    .repeat-trigger-ico { font-size: 16px; line-height: 1; }

    /* Category grid */
    .cat-section-label {
      padding: 12px 20px 4px;
      font-size: 11px;
      font-weight: 700;
      color: var(--text-3);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .cat-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      padding: 6px 16px 12px;
    }

    .cat-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      padding: 8px 4px;
      border-radius: 13px;
      border: 2px solid transparent;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      background: var(--bg);
    }
    .cat-item:active { opacity: 0.8; }
    .cat-item.sel {
      border-color: var(--expense);
      background: var(--expense-soft);
    }

    .cat-emo { font-size: 20px; }
    .cat-nm {
      font-size: 10px;
      font-weight: 600;
      color: var(--text-2);
      text-align: center;
    }
    .cat-item.sel .cat-nm { color: var(--expense); }

    /* Sheet buttons */
    .save-btn {
      margin: 8px 20px 0;
      background: var(--expense);
      color: #fff;
      border: none;
      border-radius: 14px;
      padding: 15px;
      font-size: 15px;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      width: calc(100% - 40px);
      display: block;
    }
    .save-btn:active { opacity: 0.88; }

    .del-btn {
      margin: 8px 20px 0;
      background: none;
      color: var(--expense);
      border: 1px solid #fca5a5;
      border-radius: 14px;
      padding: 13px;
      font-size: 14px;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      width: calc(100% - 40px);
      display: block;
    }
    .del-btn:active { background: var(--expense-soft); }

    /* Repeat picker options */
    .rep-option {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 15px 20px;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      font-size: 15px;
      color: var(--text);
      -webkit-tap-highlight-color: transparent;
    }
    .rep-option:active { background: #fafafa; }
    .rep-option.sel { color: var(--expense); font-weight: 700; }
    .rep-check { color: var(--expense); font-size: 16px; }

    /* Recurring rules list */
    .rule-row {
      display: flex;
      align-items: center;
      padding: 13px 20px;
      gap: 12px;
      border-bottom: 1px solid var(--border);
    }
    .rule-ico { font-size: 26px; flex-shrink: 0; }
    .rule-info { flex: 1; min-width: 0; }
    .rule-name { font-size: 14px; font-weight: 600; color: var(--text); }
    .rule-sub { font-size: 12px; color: var(--text-3); margin-top: 2px; }
    .rule-del {
      background: none;
      border: none;
      color: var(--text-3);
      font-size: 18px;
      cursor: pointer;
      padding: 4px 8px;
    }
    .rule-del:active { color: var(--expense); }
    .rule-row:last-child { border-bottom: none; }

    /* Toast */
    #toast {
      position: fixed;
      bottom: calc(var(--nav-h) + var(--safe-bottom) + 76px);
      left: 50%;
      transform: translateX(-50%) translateY(8px);
      background: #1e293b;
      color: #fff;
      padding: 9px 18px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
      opacity: 0;
      transition: opacity 0.2s, transform 0.2s;
      z-index: 600;
      pointer-events: none;
    }
    #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* ══ COLOURFUL THEME — matches Habit Tracker aesthetic ══ */

    html, body { background: #ffffff; } /* matches nav bar colour — any bleed-through becomes invisible */
    #app { background: linear-gradient(150deg, #fdf4ff 0%, #eef2ff 45%, #f0fdfa 100%); }

    #header {
      background: rgba(255,255,255,0.88);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom-color: rgba(124,58,237,0.12);
    }

    #nav {
      background: rgba(255,255,255,0.98);
      border-top-color: rgba(124,58,237,0.12);
    }

    .header-title {
      font-size: 20px;
      background: linear-gradient(135deg, #7c3aed 0%, #ec4899 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    /* Summary stats — colourful pastel cards */
    .summary-bar {
      background: transparent;
      padding: 12px 14px;
      gap: 10px;
      border-bottom: none;
    }
    .sum-item {
      border-left: none !important;
      border-radius: 14px;
      padding: 10px 12px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.07);
    }
    .sum-item:nth-child(1) { background: linear-gradient(135deg, #fce7f3 0%, #fda4af 100%); }
    .sum-item:nth-child(1) .sum-value { color: #be185d; }
    .sum-item:nth-child(2) { background: linear-gradient(135deg, #ede9fe 0%, #c4b5fd 100%); }
    .sum-item:nth-child(2) .sum-value { color: #6d28d9; }
    .sum-item:only-child  { background: linear-gradient(135deg, #fce7f3 0%, #fda4af 100%); }
    .sum-item:only-child .sum-value { color: #be185d; }
    .sum-label { color: rgba(0,0,0,0.42); }
    .sum-value.red { color: inherit !important; }

    /* Transaction cards — glass */
    .tx-card {
      background: rgba(255,255,255,0.85);
      border: 1px solid rgba(255,255,255,0.9);
      border-top: none; border-bottom: none;
      margin: 0 12px 10px;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 2px 14px rgba(99,102,241,0.09);
    }
    .tx-row { border-bottom-color: rgba(229,231,235,0.7); }
    .tx-row:active { background: rgba(237,233,254,0.4); }
    .day-header { padding: 10px 16px 4px; }
    .day-tag { background: #ede9fe; color: #7c3aed; }

    /* FAB — purple gradient */
    #fab {
      background: linear-gradient(135deg, #7c3aed 0%, #6366f1 100%);
      box-shadow: 0 4px 20px rgba(124,58,237,0.45);
    }

    /* Nav active — purple */
    .nav-btn.active .nav-ico { color: #7c3aed; }
    .nav-btn.active .nav-lbl { color: #7c3aed; }

    /* Month nav buttons */
    .mnav-btn { background: rgba(124,58,237,0.07); }
    .mnav-btn:active { background: rgba(124,58,237,0.15); }

    /* Save button — purple gradient */
    .save-btn {
      background: linear-gradient(135deg, #7c3aed 0%, #6366f1 100%);
      box-shadow: 0 4px 14px rgba(124,58,237,0.32);
    }

    /* Calendar — glass panels */
    .cal-week-header {
      background: rgba(255,255,255,0.85);
      border-bottom-color: rgba(229,231,235,0.7);
    }
    .cal-grid { background: rgba(255,255,255,0.75); }
    .cal-cell { border-color: rgba(229,231,235,0.55); }
    .cal-cell:active { background: rgba(237,233,254,0.4); }
    .cal-cell.is-today .cal-cnum-wrap {
      background: linear-gradient(135deg, #7c3aed, #6366f1);
      box-shadow: 0 3px 8px rgba(124,58,237,0.38);
    }
    .cal-day-panel {
      background: rgba(255,255,255,0.9);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-top: 1px solid rgba(124,58,237,0.15);
    }
    .cal-add-btn {
      background: linear-gradient(135deg, #7c3aed 0%, #6366f1 100%);
      box-shadow: 0 3px 10px rgba(124,58,237,0.35);
    }

    /* Category selection — purple */
    .cat-item.sel { border-color: #7c3aed; background: #ede9fe; }
    .cat-item.sel .cat-nm { color: #7c3aed; }
    .repeat-trigger.on { color: #7c3aed; border-color: #c4b5fd; background: #ede9fe; }

    /* Repeat / recurring sheets */
    .rep-option.sel { color: #7c3aed; }
    .rep-check { color: #7c3aed; }
    .rule-del:active { color: #7c3aed; }

    /* Stats */
    .stats-chart-section {
      background: rgba(255,255,255,0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }
    .stats-cat-list { background: rgba(255,255,255,0.82); }
    .stats-cat-row { border-bottom-color: rgba(229,231,235,0.7); }
    .stats-total-value { color: #7c3aed; }

    /* Sheets */
    .sheet { background: rgba(255,255,255,0.97); }
    .sheet-header { border-bottom-color: rgba(229,231,235,0.7); }

    /* Empty state */
    .empty-title { color: #7c3aed; }

    /* ── Nav active indicator ── */
    .nav-btn { position: relative; }
    .nav-btn.active::after {
      content: '';
      position: absolute;
      top: 0;
      left: 30%;
      right: 30%;
      height: 2px;
      background: #7c3aed;
      border-radius: 0 0 2px 2px;
    }

    /* ── Transitions ── */
    .nav-ico, .nav-lbl { transition: color 0.18s; }
    .cat-item { transition: border-color 0.12s ease, background 0.12s ease; }

    /* ── Typography refinements ── */
    .amount-input { letter-spacing: -0.5px; }
    .stats-total-value { letter-spacing: -0.5px; }
    .sum-value { letter-spacing: -0.3px; }
    .tx-amount { letter-spacing: -0.2px; }

    /* ── Content fade-in ── */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(5px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .summary-bar, .stats-chart-section { animation: fadeUp 0.2s ease both; }

    /* ── Bottom Panel (calc + cat) ── */
    #bottom-panel {
      position: sticky;
      bottom: calc(64px + env(safe-area-inset-bottom));
      z-index: 10;
      margin-top: 12px;
    }
    #calc-inner {
      display: none;
      background: #f3f4f6;
      border-radius: 16px 16px 0 0;
      overflow: hidden;
      padding-bottom: var(--safe-bottom);
      box-shadow: 0 -2px 16px rgba(0,0,0,0.08);
    }
    #cat-inner {
      display: none;
      background: #fff;
      border-radius: 16px 16px 0 0;
      max-height: 280px;
      overflow-y: auto;
      box-shadow: 0 -2px 16px rgba(0,0,0,0.08);
    }

    .calc-preview {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      padding: 6px 18px 4px;
      min-height: 30px;
      font-size: 14px;
      font-weight: 700;
      color: #7c3aed;
      background: rgba(255,255,255,0.6);
      border-top: 1px solid #e5e7eb;
    }

    .calc-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 1px;
      background: #d1d5db;
    }

    .calc-btn {
      background: #ffffff;
      border: none;
      font-size: 22px;
      font-weight: 400;
      padding: 17px 8px;
      cursor: pointer;
      font-family: inherit;
      color: #1e1b4b;
      -webkit-tap-highlight-color: transparent;
      transition: background 0.08s;
      line-height: 1;
      user-select: none;
      touch-action: manipulation;
    }
    .calc-btn:active { background: #e5e7eb; }

    .calc-op {
      background: #f5f3ff;
      color: #7c3aed;
      font-weight: 700;
      font-size: 20px;
    }
    .calc-op:active { background: #ede9fe; }

    .calc-eq {
      background: #ede9fe;
      color: #7c3aed;
      font-weight: 800;
    }
    .calc-eq:active { background: #ddd6fe; }

    .calc-back {
      background: #f9fafb;
      color: #6b7280;
      font-size: 22px;
    }
    .calc-back:active { background: #f3f4f6; }

    .calc-ok { grid-column: span 2; }

    .calc-ac {
      background: #f9fafb;
      color: #ef4444;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 0.3px;
    }
    .calc-ac:active { background: #fee2e2; }

    .calc-ok {
      background: var(--expense);
      color: #ffffff;
      font-size: 17px;
      font-weight: 700;
      letter-spacing: 0.3px;
    }
    .calc-ok:active { background: #dc2626; }

    .amount-input { cursor: pointer; }

    @media (max-width: 380px) {
      .cat-grid { gap: 4px; padding: 6px 12px 10px; }
      .cat-emo { font-size: 19px; }
      .cal-cell { min-height: 50px; }
    }

    /* ── Add page (full-screen view) ── */
    .add-page-header-title {
      font-size: 17px;
      font-weight: 700;
      color: var(--text);
    }
    .add-page-save-btn {
      background: none;
      border: none;
      font-family: inherit;
      font-size: 15px;
      font-weight: 800;
      color: #7c3aed;
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 8px;
      -webkit-tap-highlight-color: transparent;
    }
    .add-page-save-btn:active { background: rgba(124,58,237,0.08); }

    .add-action-bar {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      padding: 10px 16px;
      padding-bottom: calc(10px + env(safe-area-inset-bottom));
      background: rgba(255,255,255,0.96);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-top: 1px solid var(--border);
      display: flex;
      gap: 10px;
      z-index: 50;
    }
    .add-save-btn {
      flex: 1;
      height: 46px;
      border-radius: 14px;
      background: linear-gradient(135deg, #7c3aed, #6366f1);
      color: #fff;
      border: none;
      font-size: 15px;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      box-shadow: 0 4px 14px rgba(124,58,237,0.28);
    }
    .add-save-btn:active { opacity: 0.85; }
    .add-delete-btn {
      flex: 1;
      height: 46px;
      border-radius: 14px;
      background: #fff5f5;
      color: #ef4444;
      border: 1.5px solid #fca5a5;
      font-size: 15px;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .add-delete-btn:active { opacity: 0.85; }
    .add-page-back-btn {
      background: none;
      border: none;
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      color: #7c3aed;
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      gap: 4px;
      -webkit-tap-highlight-color: transparent;
    }
    .add-page-back-btn:active { background: rgba(124,58,237,0.08); }

    /* ── Category pick row ── */
    #cat-sheet { z-index: 400; }
    .cat-pick-row { cursor: pointer; -webkit-tap-highlight-color: transparent; }
    .cat-pick-row:active { background: rgba(237,233,254,0.4); }
    .cat-item { position: relative; }

    /* ── Add-category form ── */
    .cat-new-form {
      padding: 28px 24px 24px;
      display: flex; flex-direction: column; gap: 20px;
    }
    .cat-new-input {
      width: 100%; height: 52px; font-size: 16px;
      border: none; border-bottom: 2px solid #e5e7eb;
      background: transparent; outline: none;
      font-family: inherit; color: var(--text);
      padding: 0 4px;
      box-sizing: border-box;
    }
    .cat-new-input:focus { border-bottom-color: #7c3aed; }
    .cat-new-input::placeholder { color: #d1d5db; }
    .cat-new-save-btn {
      width: 100%; padding: 16px; border: none; border-radius: 14px;
      background: linear-gradient(135deg, #7c3aed 0%, #6366f1 100%);
      color: #fff; font-size: 16px; font-weight: 700; font-family: inherit; cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .cat-new-save-btn:active { opacity: 0.85; }
    .cat-back-btn {
      background: none; border: none; padding: 4px 0; cursor: pointer;
      font-size: 15px; color: #7c3aed; font-family: inherit; font-weight: 600;
      display: flex; align-items: center; gap: 4px;
      -webkit-tap-highlight-color: transparent;
    }
    .cat-add-tile {
      border: 2px dashed rgba(124,58,237,0.3) !important;
      background: rgba(124,58,237,0.04) !important;
    }
    .cat-add-tile .cat-emo { color: #7c3aed; font-size: 20px; font-weight: 700; }
    .cat-add-tile .cat-nm  { color: #7c3aed; font-weight: 600; }
    .cat-item-del {
      position: absolute; top: 4px; right: 4px;
      width: 18px; height: 18px;
      background: rgba(239,68,68,0.15); color: #ef4444;
      border: none; border-radius: 9px; font-size: 10px;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      -webkit-tap-highlight-color: transparent;
    }
    .cat-grid-3 { grid-template-columns: repeat(3, 1fr); }

    /* ── Description & Photo ── */
    .desc-row {
      display: flex; align-items: flex-start;
      padding: 12px 20px; border-bottom: 1px solid var(--border); gap: 12px;
    }
    .desc-textarea {
      flex: 1; font-size: 16px; font-weight: 500; color: var(--text);
      background: none; border: none; outline: none; font-family: inherit;
      resize: none; min-height: 90px; line-height: 1.55; padding-top: 1px;
    }
    .desc-textarea::placeholder { color: #d1d5db; font-weight: 400; }
    .cam-btn {
      width: 34px; height: 34px; border-radius: 10px;
      background: rgba(124,58,237,0.08); border: none; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      color: #7c3aed; flex-shrink: 0; -webkit-tap-highlight-color: transparent;
    }
    .cam-btn:active { background: rgba(124,58,237,0.18); }
    .photo-preview {
      margin: 0 20px 10px; border-radius: 14px; overflow: hidden;
      position: relative; box-shadow: 0 3px 14px rgba(0,0,0,0.12);
    }
    .photo-preview img { width: 100%; max-height: 180px; object-fit: cover; display: block; }
    .photo-del-btn {
      position: absolute; top: 8px; right: 8px;
      width: 30px; height: 30px; background: rgba(0,0,0,0.52);
      border: none; border-radius: 15px; color: #fff; font-size: 14px;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      -webkit-tap-highlight-color: transparent;
    }

    /* ── Photo action sheet ── */
    #photo-action {
      position: fixed; inset: 0; z-index: 550; display: none;
      flex-direction: column; justify-content: flex-end;
      padding: 0 16px calc(var(--safe-bottom) + 16px);
    }
    #photo-action.show { display: flex; }
    .photo-action-backdrop { position: absolute; inset: 0; background: rgba(0,0,0,0.4); }
    .photo-action-inner { position: relative; display: flex; flex-direction: column; gap: 10px; }
    .photo-action-menu { background: rgba(255,255,255,0.98); border-radius: 16px; overflow: hidden; }
    .photo-action-item {
      width: 100%; background: none; border: none;
      border-bottom: 1px solid var(--border);
      padding: 17px 20px; font-size: 16px; color: var(--text);
      cursor: pointer; font-family: inherit; text-align: left;
      display: flex; align-items: center; gap: 12px;
      -webkit-tap-highlight-color: transparent;
    }
    .photo-action-item:last-child { border-bottom: none; }
    .photo-action-item:active { background: #f9fafb; }
    .photo-action-cancel {
      width: 100%; background: rgba(255,255,255,0.98); border: none;
      padding: 17px; font-size: 16px; font-weight: 700; color: #7c3aed;
      border-radius: 16px; cursor: pointer; font-family: inherit;
      -webkit-tap-highlight-color: transparent;
    }
    .photo-action-cancel:active { background: #f5f3ff; }
    #data-action {
      position: fixed; inset: 0; z-index: 550; display: none;
      flex-direction: column; justify-content: flex-end;
      padding: 0 16px calc(env(safe-area-inset-bottom, 0px) + 16px);
    }
    #data-action.show { display: flex; }
  </style>
</head>
<body>
<div id="app">
  <div id="header"></div>
  <div id="content"></div>
  <nav id="nav">
    <button class="nav-btn" id="nb-transactions" onclick="switchView('transactions')">
      <svg class="nav-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2M12 12h.01M12 16h.01"/>
      </svg>
      <span class="nav-lbl">Transactions</span>
    </button>
    <button class="nav-btn" id="nb-calendar" onclick="switchView('calendar')">
      <svg class="nav-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/>
      </svg>
      <span class="nav-lbl">Calendar</span>
    </button>
    <button class="nav-btn" id="nb-stats" onclick="switchView('stats')">
      <svg class="nav-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/>
      </svg>
      <span class="nav-lbl">Stats</span>
    </button>
    <button class="nav-btn" id="nb-recurring" onclick="switchView('recurring')">
      <svg class="nav-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M17 1l4 4-4 4"/><path d="M3 11V9a4 4 0 014-4h14"/><path d="M7 23l-4-4 4-4"/><path d="M21 13v2a4 4 0 01-4 4H3"/>
      </svg>
      <span class="nav-lbl">Recurring</span>
    </button>
    <button class="nav-btn" id="nb-monthly" onclick="switchView('monthly')">
      <svg class="nav-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>
      </svg>
      <span class="nav-lbl">Monthly</span>
    </button>
  </nav>
</div>
<input type="file" id="import-file" accept=".json" style="display:none" onchange="importData(this)">
<div id="data-action">
  <div class="photo-action-backdrop" onclick="closeDataSheet()"></div>
  <div class="photo-action-inner">
    <div class="photo-action-menu">
      <button class="photo-action-item" onclick="exportData()">⬇️ Export backup</button>
      <button class="photo-action-item" onclick="closeDataSheet();document.getElementById('import-file').click()">⬆️ Import backup</button>
    </div>
    <button class="photo-action-cancel" onclick="closeDataSheet()">Cancel</button>
  </div>
</div>

<button id="fab" onclick="openAdd()">
  <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
</button>

<div id="overlay" onclick="overlayClick()"></div>

<!-- Add / Edit Sheet -->
<div class="sheet" id="add-sheet">
  <div class="sheet-handle"></div>

<script>
// ── Constants ─────────────────────────────────────────────────────────────────

const STORAGE_KEY = 'et_v1';

const CATS = [
  { key:'groceries',  label:'Groceries',  emoji:'🍎', color:'#10b981' },
  { key:'eating_out', label:'Eating Out', emoji:'🍽️', color:'#f59e0b' },
  { key:'transport',  label:'Transport',  emoji:'🚗', color:'#3b82f6' },
  { key:'utilities',  label:'Utilities',  emoji:'💡', color:'#6366f1' },
  { key:'health',     label:'Health',     emoji:'💊', color:'#ef4444' },
  { key:'beauty',     label:'Beauty',     emoji:'🌸', color:'#d946ef' },
  { key:'fitness',    label:'Fitness',    emoji:'💪', color:'#22d3ee' },
  { key:'seafood',    label:'Seafood',    emoji:'🦞', color:'#0891b2' },
  { key:'snacks',     label:'Snacks',     emoji:'🍿', color:'#f97316' },
  { key:'veggies',    label:'Veggies',    emoji:'🥦', color:'#22c55e' },
  { key:'fruits',     label:'Fruits',     emoji:'🍇', color:'#a78bfa' },
  { key:'pastries',   label:'Pastries',   emoji:'🥐', color:'#d97706' },
  { key:'household',     label:'Household',     emoji:'🏠', color:'#8b5cf6' },
  { key:'subscriptions', label:'Subscriptions', emoji:'🔔', color:'#64748b' },
  { key:'insurance',     label:'Insurance',     emoji:'🛡️', color:'#0ea5e9' },
  { key:'crystal',       label:'Crystal',       emoji:'🔮', color:'#a855f7' },
  { key:'other',      label:'Other',      emoji:'❓', color:'#94a3b8' },
];

const CAT = Object.fromEntries(CATS.map(c => [c.key, c]));

const REPEATS = [
  { key:'none',    label:'Nothing' },
  { key:'monthly', label:'Every Month' },
];

const RMAP = Object.fromEntries(REPEATS.map(r => [r.key, r]));

const WDAYS = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const MONTHS = ['January','February','March','April','May','June',
                'July','August','September','October','November','December'];

// ── State ─────────────────────────────────────────────────────────────────────

let data = { transactions: [], recurring: [], customCats: [], hiddenCats: [] };
let view = 'transactions';

let txYear       = new Date().getFullYear();
let txMon        = new Date().getMonth();
let txWeekOffset = 0;
let txSelDay     = todayStr();

let calYear = new Date().getFullYear();
let calMon  = new Date().getMonth();
let calSel  = todayStr();

let stYear  = new Date().getFullYear();
let stMon   = new Date().getMonth();
let catDetailKey = '';

// Add/edit form state
let fMode     = 'add'; // 'add' | 'edit'
let fEditId   = null;
let fDate     = todayStr();
let fAmount   = '';
let fCat      = '';
let fNote     = '';
let fRepeat   = 'none';

// Which sheet is open above the add sheet
let subSheet    = null; // 'repeat' | 'recurring' | 'cat' | null
let addViewPrev = 'transactions'; // view to return to when closing add page

// Description & photo form state
let fDescription  = '';
let fPhoto        = null; // base64 data URL
let fIsRecurring  = false; // true when editing a transaction that has/had a recurring rule
let ruleEditId    = null;
let ruleEditNote  = '';
let ruleEditCents = 0;
let ruleEditFreq  = '';
let ruleEditCat   = '';

// Add-category form state
let catAddMode  = false;
let newCatLabel = '';

const CAT_COLORS = [
  '#10b981','#f59e0b','#3b82f6','#ec4899',
  '#8b5cf6','#ef4444','#f97316','#06b6d4',
  '#84cc16','#d946ef','#14b8a6','#64748b',
];

// ── Helpers ───────────────────────────────────────────────────────────────────

function todayStr() {
  return new Date().toISOString().slice(0, 10);
}

function uid() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
}

function rm(n) {
  return 'RM ' + Number(n).toLocaleString('en-MY', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

function isoDate(y, m, d) {
  return `${y}-${String(m + 1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
}

function parseDate(ds) {
  const [y, m, d] = ds.split('-').map(Number);
  return { y, m: m - 1, d };
}

function displayDate(ds) {
  const { y, m, d } = parseDate(ds);
  const wd = new Date(y, m, d).getDay();
  return `${WDAYS[wd]}, ${String(d).padStart(2,'0')}/${String(m+1).padStart(2,'0')}/${y}`;
}

function fmtFormDate(ds) {
  if (!ds) return '';
  const { y, m, d } = parseDate(ds);
  return `${d} ${MONTHS[m].slice(0, 3)} ${y}`;
}

function daysInMonth(y, m) {
  return new Date(y, m + 1, 0).getDate();
}

function lastDayOfMonth(y, m) {
  return isoDate(y, m, daysInMonth(y, m));
}

function addMonths(ds, n) {
  const { y, m, d } = parseDate(ds);
  const totalM = (m) + n;
  const ny = y + Math.floor(totalM / 12);
  const nm = totalM % 12;
  const nd = Math.min(d, daysInMonth(ny, nm));
  return isoDate(ny, nm, nd);
}

function getAllCats() {
  const hidden = new Set(data.hiddenCats || []);
  return [...CATS, ...(data.customCats || [])].filter(c => !hidden.has(c.key));
}

function getCat(key) {
  return CAT[key] || (data.customCats || []).find(c => c.key === key) || CAT['other'];
}

function syncFormState() {
  const da = document.getElementById('f-date');
  const am = document.getElementById('f-amt');
  const no = document.getElementById('f-note');
  const de = document.getElementById('f-desc');
  if (da) fDate        = da.value;
  if (am) fAmount      = (am.textContent || am.value || '').replace(/,/g, '');
  if (no) fNote        = no.value;
  if (de) fDescription = de.value;
}

function evalAmount(raw) {
  const s = String(raw).replace(/\s/g, '');
  if (!s) return null;
  if (/^\d*\.?\d*$/.test(s)) return parseFloat(s) || null;
  // Whitelist: only digits, decimals, and basic operators
  if (!/^[\d\.\+\-\*\/\(\)]+$/.test(s)) return null;
  try {
    // eslint-disable-next-line no-new-func
    const result = Function('"use strict"; return (' + s + ')')();
    if (typeof result === 'number' && isFinite(result) && result > 0)
      return parseFloat(result.toFixed(2));
  } catch(e) {}
  return null;
}

function resolveAmount(el) {
  const result = evalAmount(el.value);
  if (result !== null) {
    fAmount = String(result);
    el.value = fAmount;
  }
}

function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function escAttr(s) {
  return String(s).replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

// ── Recurring ─────────────────────────────────────────────────────────────────

function nextOccurrence(ds, freq) {
  const { y, m, d } = parseDate(ds);
  let dt = new Date(y, m, d);

  switch (freq) {
    case 'daily':
      dt.setDate(dt.getDate() + 1); break;

    case 'weekdays':
      do { dt.setDate(dt.getDate() + 1); }
      while (dt.getDay() === 0 || dt.getDay() === 6);
      break;

    case 'weekend':
      do { dt.setDate(dt.getDate() + 1); }
      while (dt.getDay() !== 0 && dt.getDay() !== 6);
      break;

    case 'weekly':
      dt.setDate(dt.getDate() + 7); break;

    case 'biweekly':
      dt.setDate(dt.getDate() + 14); break;

    case 'every4weeks':
      dt.setDate(dt.getDate() + 28); break;

    case 'monthly':
      return addMonths(ds, 1);

    case 'endofmonth': {
      // last day of the month after ds's month
      const nm = m + 1 > 11 ? 0 : m + 1;
      const ny2 = m + 1 > 11 ? y + 1 : y;
      return lastDayOfMonth(ny2, nm);
    }

    case 'every2months': return addMonths(ds, 2);
    case 'every3months': return addMonths(ds, 3);
    case 'every4months': return addMonths(ds, 4);
    case 'every6months': return addMonths(ds, 6);

    case 'annually': return addMonths(ds, 12);
  }

  return dt.toISOString().slice(0, 10);
}

function generateRecurring() {
  const td = todayStr();
  let dirty = false;

  for (const rule of data.recurring) {
    let cur = rule.lastGenerated
      ? nextOccurrence(rule.lastGenerated, rule.frequency)
      : rule.startDate;

    let guard = 0;
    while (cur <= td && guard < 1000) {
      guard++;
      const exists = data.transactions.some(t => t.recurringId === rule.id && t.date === cur);
      if (!exists) {
        data.transactions.push({
          id: uid(), date: cur,
          amount: rule.amount, category: rule.category,
          note: rule.note, createdAt: new Date().toISOString(),
          recurringId: rule.id,
        });
        dirty = true;
      }
      rule.lastGenerated = cur;
      cur = nextOccurrence(cur, rule.frequency);
    }
  }

  if (dirty) save();
}

// ── Storage ───────────────────────────────────────────────────────────────────

function load() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      data.transactions = parsed.transactions || [];
      data.recurring    = parsed.recurring    || [];
      data.customCats   = parsed.customCats   || [];
      data.hiddenCats   = parsed.hiddenCats   || [];
    }
  } catch(e) {}
  // Backfill new fields on existing transactions
  data.transactions = data.transactions.map(t => ({
    description: '', photo: null, ...t,
  }));
  generateRecurring();
}

function save() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
}

// ── Data queries ──────────────────────────────────────────────────────────────

function txForMonth(y, m) {
  const pfx = `${y}-${String(m + 1).padStart(2,'0')}`;
  return data.transactions.filter(t => t.date.startsWith(pfx));
}

function txForDay(ds) {
  return data.transactions.filter(t => t.date === ds);
}

function totalDay(ds) {
  return txForDay(ds).reduce((s, t) => s + Number(t.amount), 0);
}

function totalMonth(y, m) {
  return txForMonth(y, m).reduce((s, t) => s + Number(t.amount), 0);
}

// ── Render ────────────────────────────────────────────────────────────────────

function render() {
  renderHeader();
  renderContent();
  renderNav();
}

function renderNav() {
  const isAdd    = view === 'add';
  const isDetail = view === 'cat-detail';
  document.getElementById('nav').style.display = (isAdd || isDetail) ? 'none' : '';
  document.getElementById('fab').style.display = (isAdd || isDetail || view === 'calendar' || view === 'transactions' || view === 'stats' || view === 'recurring' || view === 'monthly') ? 'none' : 'flex';
  if (isAdd || isDetail) return;
  ['transactions','calendar','stats','recurring','monthly'].forEach(v => {
    document.getElementById('nb-' + v).classList.toggle('active', view === v);
  });
}

function renderHeader() {
  const el = document.getElementById('header');

  if (view === 'add') {
    const backLabels = { transactions: 'Trans.', calendar: 'Calendar', stats: 'Stats', 'cat-detail': 'Detail' };
    const backLbl = backLabels[addViewPrev] || 'Back';
    const rightSlot = (fMode === 'edit' && fIsRecurring)
      ? `<span style="width:60px;flex-shrink:0;display:flex;align-items:center;justify-content:flex-end;padding-right:12px;font-size:18px;">🔁</span>`
      : `<span style="width:60px;flex-shrink:0"></span>`;
    el.innerHTML = `
      <div class="header-row">
        <button class="add-page-back-btn" onclick="closeAddView()">
          <svg width="8" height="14" viewBox="0 0 8 14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="7 1 1 7 7 13"/></svg>
          ${backLbl}
        </button>
        <span class="add-page-header-title">${fMode === 'add' ? 'New Expense' : 'Edit Expense'}</span>
        ${rightSlot}
      </div>`;
    return;
  }

  if (view === 'cat-detail') {
    const cat = getCat(catDetailKey);
    el.innerHTML = `
      <div class="header-row">
        <button class="add-page-back-btn" onclick="closeCatDetail()">
          <svg width="8" height="14" viewBox="0 0 8 14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="7 1 1 7 7 13"/></svg>
          Stats
        </button>
        <div style="text-align:center;flex:1">
          <div class="add-page-header-title">${cat.emoji} ${cat.label}</div>
          <div style="font-size:11px;color:#9ca3af;margin-top:1px">${MONTHS[stMon]} ${stYear}</div>
        </div>
        <span style="width:60px;flex-shrink:0"></span>
      </div>`;
    return;
  }

  const navHtml = (id, prev, next) => `
    <div class="month-nav" id="${id}">
      <button class="mnav-btn" onclick="${prev}()" ontouchstart="event.stopPropagation()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
      </button>
      <span class="month-label" id="${id}-lbl"></span>
      <button class="mnav-btn" onclick="${next}()" ontouchstart="event.stopPropagation()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
      </button>
    </div>`;

  if (view === 'transactions') {
    const txMonthTotal = totalMonth(txYear, txMon);
    el.innerHTML = `
      <div class="header-row">
        <span class="header-title">Transactions</span>
      </div>
      ${navHtml('tx-nav','prevTx','nextTx')}
      <div style="text-align:center;padding:0 0 10px;margin-top:-8px;font-size:11px;font-weight:600;color:#374151">${rm(txMonthTotal)}</div>`;
    document.getElementById('tx-nav-lbl').textContent = MONTHS[txMon] + ' ' + txYear;
    const txNavBtns = document.querySelectorAll('#tx-nav .mnav-btn');
    const txAtCurrent = txYear === new Date().getFullYear() && txMon === new Date().getMonth();
    if (txNavBtns[1]) { txNavBtns[1].disabled = txAtCurrent; txNavBtns[1].style.opacity = txAtCurrent ? '0.3' : ''; }
    initSwipe('tx-nav', prevTx, nextTx);

  } else if (view === 'calendar') {
    el.innerHTML = `
      <div class="header-row"><span class="header-title">Calendar</span></div>
      ${navHtml('cal-nav','prevCal','nextCal')}`;
    document.getElementById('cal-nav-lbl').textContent = MONTHS[calMon] + ' ' + calYear;
    const calNavBtns = document.querySelectorAll('#cal-nav .mnav-btn');
    const calAtCurrent = calYear === new Date().getFullYear() && calMon === new Date().getMonth();
    if (calNavBtns[1]) { calNavBtns[1].disabled = calAtCurrent; calNavBtns[1].style.opacity = calAtCurrent ? '0.3' : ''; }
    initSwipe('cal-nav', prevCal, nextCal);

  } else if (view === 'recurring') {
    el.innerHTML = `<div class="header-row"><span class="header-title">Recurring</span></div>`;

  } else if (view === 'monthly') {
    el.innerHTML = `<div class="header-row">

      </button>

  } else {

function renderContent() {
  const el = document.getElementById('content');
  if      (view === 'add')          el.innerHTML = buildAddPage();
  else if (view === 'transactions') el.innerHTML = buildTransactions();
  else if (view === 'calendar')     el.innerHTML = buildCalendar();
  else if (view === 'cat-detail')   el.innerHTML = buildCatDetail();
  else if (view === 'recurring')    el.innerHTML = buildRecurring();
  else if (view === 'monthly')      el.innerHTML = buildMonthly();
  else                              el.innerHTML = buildStats();
  if (view === 'add') initPanel();
  if (view === 'transactions') { renderTxWeekStrip(); initSwipeRows(); }
  if (view === 'calendar') initSwipeRows();
}

// ── Transactions view ─────────────────────────────────────────────────────────

function buildTransactions() {
  const txs   = txForDay(txSelDay);
  const total = txs.reduce((s, t) => s + Number(t.amount), 0);
  const { y, m, d } = parseDate(txSelDay);
  const wd = new Date(y, m, d).getDay();

  let html = `<div id="tx-week-strip" class="week-strip"></div>
  <div class="summary-bar">
    <div class="sum-item">
      <div class="sum-label">Expenses</div>
      <div class="sum-value red">${rm(total)}</div>
    </div>
    <div class="sum-item">
      <div class="sum-label">Transactions</div>
      <div class="sum-value">${txs.length}</div>
    </div>
  </div>`;

  html += `<div class="day-group" id="tx-day-${txSelDay}">
    <div class="day-header">
      <span class="day-num">${d}</span>
      <span class="day-tag">${WDAYS[wd]}</span>
      <button class="cal-add-btn" onclick="openAdd()" style="margin-left:auto;">+</button>
    </div>`;

  if (!txs.length) {
    html += `<div class="empty" style="padding: 32px 0;">
      <div class="empty-ico">💸</div>
      <div class="empty-title">No expenses on ${WDAYS[wd]}, ${d} ${MONTHS[m]}</div>
      <div class="empty-sub">Tap + to log an expense</div>
    </div>`;
  } else {
    const group = txs.slice().sort((a, b) => b.amount - a.amount);
    html += `<div class="tx-card">`;
    for (const t of group) html += txRowHtml(t, getCat(t.category));
    html += `</div>`;
  }

  html += `</div>`;

  return html;
}

function txRowHtml(t, cat) {
  return `<div class="tx-row-wrap" data-id="${t.id}">
    <button class="tx-swipe-del" onclick="swipeDeleteTx('${t.id}')">Delete</button>
    <div class="tx-row" onclick="openEdit('${t.id}')">
      <div class="tx-left">
        <div class="tx-icon" style="background:${cat.color}1a">${cat.emoji}</div>
        <div class="tx-cat">${esc(cat.label)}</div>
      </div>
      <div class="tx-info">
        <div class="tx-note">${esc(t.note || '—')} ${t.recurringId && data.recurring.some(r => r.id === t.recurringId) ? '<span class="tx-recur-badge">🔁</span>' : ''}</div>
      </div>
      <div class="tx-right">

function buildCalendar() {
  const td = todayStr();
  const first = new Date(calYear, calMon, 1).getDay(); // 0=Sun
  const dim   = daysInMonth(calYear, calMon);
  const mTotal = totalMonth(calYear, calMon);

  let html = `<div class="summary-bar">
    <div class="sum-item">
      <div class="sum-label">Month Expenses</div>
      <div class="sum-value red">${rm(mTotal)}</div>
    </div>
  </div>
  <div class="cal-week-header">
    ${WDAYS.map(w => `<div class="cal-wday">${w}</div>`).join('')}
  </div>
  <div class="cal-grid">`;

  // Leading blank cells
  for (let i = 0; i < first; i++) {
    html += `<div class="cal-cell other-month"></div>`;
  }

  for (let d = 1; d <= dim; d++) {
    const ds = isoDate(calYear, calMon, d);
    const dt = totalDay(ds);
    const isToday = ds === td;
    const isSel   = ds === calSel;
    const cls = ['cal-cell', isToday ? 'is-today' : '', isSel ? 'is-selected' : ''].filter(Boolean).join(' ');

    html += `<div class="${cls}" onclick="selectCalDay('${ds}')">
      <div class="cal-cnum-wrap"><span class="cal-cnum">${d}</span></div>
      ${dt > 0 ? `<div class="cal-day-amt">${rm(dt)}</div>` : ''}
    </div>`;
  }

  // Trailing blank cells (complete last row)
  const filled = first + dim;
  const trail  = filled % 7 === 0 ? 0 : 7 - (filled % 7);
  for (let i = 0; i < trail; i++) {
    html += `<div class="cal-cell other-month"></div>`;
  }

  html += `</div>`;

  // Selected day panel
  const selTxs = txForDay(calSel).sort((a,b) => b.amount - a.amount);
  const { y: sy, m: sm, d: sd } = parseDate(calSel);
  const swday = new Date(sy, sm, sd).getDay();
  const selTotal = selTxs.reduce((s,t) => s + Number(t.amount), 0);

  html += `<div class="cal-day-panel">
    <div class="cal-day-panel-header">
      <div>
        <span class="cal-day-panel-label">${WDAYS[swday]}, ${sd} ${MONTHS[sm]}</span>
        ${selTotal > 0 ? `<span class="cal-day-panel-total"> · ${rm(selTotal)}</span>` : ''}
      </div>
      <button class="cal-add-btn" onclick="openAddForDay('${calSel}')">+</button>
    </div>`;

  if (selTxs.length === 0) {
    html += `<div style="padding:16px 20px;font-size:13px;color:var(--text-3);">No expenses on this day</div>`;
  } else {
    html += `<div class="tx-card">`;
    for (const t of selTxs) {
      html += txRowHtml(t, getCat(t.category));
    }
    html += `</div>`;
  }

  html += `</div>`;

  return html;
}

function buildStats() {
  const txs   = txForMonth(stYear, stMon);
  const total = txs.reduce((s, t) => s + Number(t.amount), 0);

  const catMap = {};
  for (const t of txs) {
    catMap[t.category] = (catMap[t.category] || 0) + Number(t.amount);
  }

  const segs = Object.entries(catMap)
    .map(([k, v]) => ({ ...getCat(k), amount: v }))
    .sort((a, b) => b.amount - a.amount);

  const chart = buildDonut(segs, total);

  let html = `<div class="stats-chart-section">
    ${chart}
    <div class="stats-total-label">Total Expenses</div>
    <div class="stats-total-value">${rm(total)}</div>
  </div>`;

  if (!segs.length) {
    return html + `<div class="empty">
      <div class="empty-ico">📊</div>
      <div class="empty-title">No data yet</div>
      <div class="empty-sub">Add expenses to see the breakdown</div>
    </div>`;
  }

  html += `<div class="stats-cat-list">`;
  for (const s of segs) {
    const pct = total > 0 ? (s.amount / total * 100) : 0;
    html += `<div class="stats-cat-row" onclick="openCatDetail('${s.key}')">
      <span class="stats-cat-emoji">${s.emoji}</span>
      <span class="stats-cat-name">${s.label}</span>
      <span class="stats-pct">${pct.toFixed(0)}%</span>
      <span class="stats-amt">${rm(s.amount)}</span>
    </div>`;
  }
  html += `</div>`;

  return html;
}

function buildDonut(segs, total) {
  const cx = 200, cy = 150, r = 90, sw = 28;
  const circ = 2 * Math.PI * r;

  if (!segs.length) {
    return `<svg width="300" height="225" viewBox="0 0 400 300" style="display:block;margin:0 auto">
      <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="#e5e7eb" stroke-width="${sw}"/>
    </svg>`;
  }

  let offset = 0, paths = '', labels = '';
  for (const s of segs) {
    const pct  = total > 0 ? s.amount / total : 0;
    const dash = pct * circ;
    paths += `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${s.color}" stroke-width="${sw}"
      stroke-dasharray="${dash.toFixed(2)} ${(circ - dash).toFixed(2)}"
      stroke-dashoffset="${(-offset).toFixed(2)}"
      transform="rotate(-90 ${cx} ${cy})"/>`;

    if (pct >= 0.10) {
      const midA   = -Math.PI / 2 + (offset + dash / 2) / r;
      const lineR  = r + sw / 2 + 8;
      const lblR   = r + sw / 2 + 28;
      const lx1    = cx + lineR * Math.cos(midA);
      const ly1    = cy + lineR * Math.sin(midA);
      const tx     = cx + lblR  * Math.cos(midA);
      const ty     = cy + lblR  * Math.sin(midA);
      const anchor = Math.cos(midA) < -0.15 ? 'end' : Math.cos(midA) > 0.15 ? 'start' : 'middle';
      const name   = s.label.length > 10 ? s.label.slice(0, 9) + '…' : s.label;
      labels += `<line x1="${lx1.toFixed(1)}" y1="${ly1.toFixed(1)}" x2="${tx.toFixed(1)}" y2="${ty.toFixed(1)}" stroke="${s.color}" stroke-width="2" stroke-linecap="round"/>
      <text x="${tx.toFixed(1)}" y="${ty.toFixed(1)}" font-family="Plus Jakarta Sans,sans-serif" text-anchor="${anchor}" font-weight="700">
        <tspan x="${tx.toFixed(1)}" dy="-9" font-size="16" fill="#374151">${name}</tspan>
        <tspan x="${tx.toFixed(1)}" dy="20" font-size="14" fill="${s.color}">${Math.round(pct * 100)}%</tspan>
      </text>`;
    }

    offset += dash;
  }

  return `<svg width="300" height="225" viewBox="0 0 400 300" overflow="visible" style="display:block;margin:0 auto">${paths}${labels}</svg>`;
}

function weekOffsetForDate(ds) {
  const today = new Date(); today.setHours(12, 0, 0, 0);
  const thisSun = new Date(today); thisSun.setDate(today.getDate() - today.getDay());
  const target = new Date(ds + 'T12:00:00');
  const targetSun = new Date(target); targetSun.setDate(target.getDate() - target.getDay());
  return Math.round((targetSun - thisSun) / (7 * 24 * 60 * 60 * 1000));
}

function syncTxToMonth() {
  const td = todayStr();
  const last = lastDayOfMonth(txYear, txMon);
  txSelDay = last <= td ? last : td;
  txWeekOffset = weekOffsetForDate(txSelDay);
}

function getTxWeekDays(offset = 0) {
  const today = new Date();
  const dow = today.getDay(); // 0 = Sun
  const sun = new Date(today);
  sun.setDate(today.getDate() - dow + offset * 7);
  sun.setHours(12, 0, 0, 0);
  return Array.from({ length: 7 }, (_, i) => {
    const d = new Date(sun);
    d.setDate(sun.getDate() + i);
    return d.toISOString().slice(0, 10);
  });
}

function swipeDeleteTx(id) {

const SWIPE_W = 76; // must match .tx-swipe-del width
let _openWrap = null;

function closeOpenSwipeRow() {
  if (_openWrap) {
    const r = _openWrap.querySelector('.tx-row');
    if (r) { r.style.transition = 'transform 0.2s ease'; r.style.transform = 'translateX(0)'; }
    _openWrap = null;
  }
}

function initSwipeRows() {
  document.querySelectorAll('.tx-row-wrap').forEach(wrap => {
    if (wrap._swipeInit) return;
    wrap._swipeInit = true;
    const row = wrap.querySelector('.tx-row');
    let sx = 0, sy = 0, isOpen = false, tracking = false;

    wrap.addEventListener('touchstart', e => {
      sx = e.touches[0].clientX;
      sy = e.touches[0].clientY;
      tracking = true;
      row.style.transition = 'none';
    }, { passive: true });

    wrap.addEventListener('touchmove', e => {
      if (!tracking) return;
      const dx = e.touches[0].clientX - sx;
      const dy = e.touches[0].clientY - sy;
      if (Math.abs(dy) > Math.abs(dx) + 4) { tracking = false; return; }
      e.preventDefault();
      const base = isOpen ? -SWIPE_W : 0;
      const x = Math.max(-SWIPE_W, Math.min(0, base + dx));
      row.style.transform = `translateX(${x}px)`;
    }, { passive: false });

    wrap.addEventListener('touchend', e => {
      if (!tracking) return;
      tracking = false;
      const dx = e.changedTouches[0].clientX - sx;
      row.style.transition = 'transform 0.2s ease';
      if (!isOpen && dx < -SWIPE_W / 2) {
        row.style.transform = `translateX(-${SWIPE_W}px)`;
        if (_openWrap && _openWrap !== wrap) closeOpenSwipeRow();
        _openWrap = wrap;
        isOpen = true;
      } else if (isOpen && dx > SWIPE_W / 2) {
        row.style.transform = 'translateX(0)';
        _openWrap = null;
        isOpen = false;
      } else if (isOpen) {
        row.style.transform = `translateX(-${SWIPE_W}px)`;
      } else {
        row.style.transform = 'translateX(0)';
      }
    }, { passive: true });

    /* Tap on the row while open → close instead of edit */
    row.addEventListener('click', e => {
      if (isOpen) { closeOpenSwipeRow(); isOpen = false; e.stopPropagation(); e.preventDefault(); }
    }, true);
  });
}

function renderTxWeekStrip() {

  const cells = week.map((ds, i) => {

    const isSel   = ds === txSelDay;
    let dotCls  = 'ws-dot' + (isToday ? ' today' : isFuture ? ' future' : ' past') + (isSel ? ' selected' : '');
    let cellCls = 'ws-cell' + (isFuture ? ' future' : '');
    const hasExp = expDays.has(ds) && !isFuture;
    const onclick = !isFuture ? `onclick="selectTxDay('${ds}')"` : '';
    return `<div class="${cellCls}" ${onclick}>

    cells +

function selectTxDay(ds) {
  if (ds > todayStr()) return;

  const { y, m } = parseDate(ds);

function changeTxWeek(dir) {
  txWeekOffset = Math.min(0, txWeekOffset + dir);
  const week = getTxWeekDays(txWeekOffset);
  const td = todayStr();
  if (txWeekOffset >= 0) {
    txSelDay = td;
  } else {
    const cur = week.find(d => d === txSelDay) ? txSelDay : week[6];
    txSelDay = cur <= td ? cur : td;
  }
  const { y, m } = parseDate(txSelDay);
  if (y !== txYear || m !== txMon) { txYear = y; txMon = m; }
  renderContent();
}

function initTxWeekSwipe() {
  const strip = document.getElementById('tx-week-strip');
  if (!strip || strip._swipeInit) return;
  strip._swipeInit = true;
  let startX = 0;
  strip.addEventListener('touchstart', e => { startX = e.touches[0].clientX; }, { passive: true });
  strip.addEventListener('touchend',   e => {
    const dx = e.changedTouches[0].clientX - startX;
    if (Math.abs(dx) > 40) changeTxWeek(dx > 0 ? -1 : 1);
  }, { passive: true });
  strip.addEventListener('mousedown', e => { startX = e.clientX; });
  strip.addEventListener('mouseup',   e => {
    const dx = e.clientX - startX;
    if (Math.abs(dx) > 40) changeTxWeek(dx > 0 ? -1 : 1);
  });
}

function buildMonthly() {
  // Build month -> total map
  const monthMap = {};
  for (const t of data.transactions) {
    const key = t.date.slice(0, 7); // "YYYY-MM"
    monthMap[key] = (monthMap[key] || 0) + Number(t.amount);
  }
  const keys = Object.keys(monthMap).sort().reverse(); // newest first

  if (!keys.length) {
    return `<div class="empty">
      <div class="empty-ico">📅</div>
      <div class="empty-title">No expenses yet</div>
      <div class="empty-sub">Your monthly totals will appear here</div>
    </div>`;
  }

  const allTimeTotal = keys.reduce((s, k) => s + monthMap[k], 0);
  const avg = allTimeTotal / keys.length;
  const maxVal = Math.max(...keys.map(k => monthMap[k]));

  // ── Line chart (up to last 12 months, oldest→newest left→right) ──────────
  const chartKeys = keys.slice().reverse().slice(-12); // oldest first, max 12
  const n = chartKeys.length;
  const W = 340, H = 110, PAD_L = 8, PAD_R = 8, PAD_T = 16, PAD_B = 28;
  const plotW = W - PAD_L - PAD_R;
  const plotH = H - PAD_T - PAD_B;
  const pts = chartKeys.map((k, i) => {
    const x = PAD_L + (n === 1 ? plotW / 2 : i * plotW / (n - 1));
    const y = PAD_T + plotH - (maxVal > 0 ? (monthMap[k] / maxVal) * plotH : 0);
    return { x, y, k, v: monthMap[k] };
  });

  // smooth polyline via cardinal spline control points
  function cardinalPoints(p) {
    if (p.length < 2) return `M ${p[0].x} ${p[0].y}`;
    let d = `M ${p[0].x} ${p[0].y}`;
    for (let i = 0; i < p.length - 1; i++) {
      const p0 = p[Math.max(i - 1, 0)];
      const p1 = p[i];
      const p2 = p[i + 1];
      const p3 = p[Math.min(i + 2, p.length - 1)];
      const t = 0.3;
      const cp1x = p1.x + (p2.x - p0.x) * t;
      const cp1y = p1.y + (p2.y - p0.y) * t;
      const cp2x = p2.x - (p3.x - p1.x) * t;
      const cp2y = p2.y - (p3.y - p1.y) * t;
      d += ` C ${cp1x} ${cp1y}, ${cp2x} ${cp2y}, ${p2.x} ${p2.y}`;
    }
    return d;
  }

  const linePath = cardinalPoints(pts);
  // area fill: close path along bottom
  const firstPt = pts[0], lastPt = pts[pts.length - 1];
  const areaPath = linePath + ` L ${lastPt.x} ${PAD_T + plotH} L ${firstPt.x} ${PAD_T + plotH} Z`;

  // x-axis labels: show first, last, and evenly spaced if >4 points
  const labelIdxs = new Set([0, n - 1]);
  if (n <= 6) {
    for (let i = 1; i < n - 1; i++) labelIdxs.add(i);
  } else {
    labelIdxs.add(Math.round(n / 4));
    labelIdxs.add(Math.round(n / 2));
    labelIdxs.add(Math.round(3 * n / 4));
  }
  const xLabels = pts.map((pt, i) => {
    if (!labelIdxs.has(i)) return '';
    const mo = parseInt(pt.k.slice(5, 7), 10) - 1;
    return `<text x="${pt.x}" y="${H - 4}" text-anchor="middle" fill="#9ca3af" font-size="9" font-family="inherit">${MONTHS[mo].slice(0,3)}</text>`;
  }).join('');

  // dots + tooltips (highlight max month)
  const dots = pts.map(pt => {
    const isMax = pt.v === maxVal;
    return `<circle cx="${pt.x}" cy="${pt.y}" r="${isMax ? 4.5 : 3}" fill="${isMax ? '#7c3aed' : '#a78bfa'}" stroke="white" stroke-width="1.5"/>`;
  }).join('');

  const gradId = 'mg' + Date.now();
  const chartSvg = `
    <svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" overflow="visible" style="display:block">
      <defs>
        <linearGradient id="${gradId}" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.25"/>
          <stop offset="100%" stop-color="#7c3aed" stop-opacity="0.02"/>
        </linearGradient>
      </defs>
      <path d="${areaPath}" fill="url(#${gradId})"/>
      <path d="${linePath}" fill="none" stroke="#7c3aed" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      ${dots}
      ${xLabels}
    </svg>`;

  let html = `<div class="summary-bar">
    <div class="sum-item">
      <div class="sum-label">All Time</div>
      <div class="sum-value">${rm(allTimeTotal)}</div>
    </div>
    <div class="sum-item">
      <div class="sum-label">Monthly Avg</div>
      <div class="sum-value">${rm(avg)}</div>
    </div>
  </div>
  <div style="margin:12px 12px 0;background:rgba(255,255,255,0.85);border:1px solid rgba(255,255,255,0.9);border-radius:16px;padding:14px 12px 10px;box-shadow:0 2px 14px rgba(99,102,241,0.09)">
    ${chartSvg}
  </div>`;

  // ── Month list grouped by year ────────────────────────────────────────────
  const byYear = {};
  for (const k of keys) {
    const yr = k.slice(0, 4);
    if (!byYear[yr]) byYear[yr] = [];
    byYear[yr].push(k);
  }
  const years = Object.keys(byYear).sort().reverse();

  html += `<div style="padding:0 12px 80px">`;
  for (const yr of years) {
    const yrKeys = byYear[yr];
    html += `<div style="padding:12px 4px 4px;font-size:11px;font-weight:700;color:#9ca3af;letter-spacing:0.05em">${yr}</div>
      <div style="background:rgba(255,255,255,0.85);border:1px solid rgba(255,255,255,0.9);border-radius:16px;overflow:hidden;box-shadow:0 2px 14px rgba(99,102,241,0.09);margin-bottom:12px">`;
    for (let i = 0; i < yrKeys.length; i++) {
      const k = yrKeys[i];
      const mo = parseInt(k.slice(5, 7), 10) - 1;
      const total = monthMap[k];
      const pct = maxVal > 0 ? (total / maxVal) * 100 : 0;
      const isLast = i === yrKeys.length - 1;
      html += `<div onclick="goToMonth(${yr},${mo})" style="padding:12px 16px;cursor:pointer${isLast ? '' : ';border-bottom:1px solid rgba(0,0,0,0.05)'}">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:7px">
          <span style="font-size:14px;font-weight:600;color:#111827">${MONTHS[mo]}</span>
          <span style="font-size:14px;font-weight:700;color:#7c3aed">${rm(total)}</span>
        </div>
        <div style="height:4px;background:#f3f4f6;border-radius:2px;overflow:hidden">
          <div style="height:100%;width:${pct.toFixed(1)}%;background:linear-gradient(90deg,#7c3aed,#a78bfa);border-radius:2px"></div>
        </div>
      </div>`;
    }
    html += `</div>`;
  }
  html += `</div>`;
  return html;
}

function exportData() {
  closeDataSheet();

  const blob = new Blob([json], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'expenses-backup.json';
  document.body.appendChild(a);

function importData(input) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const parsed = JSON.parse(e.target.result);
      if (!Array.isArray(parsed.transactions)) throw new Error('Invalid file');
      if (!confirm(`Import ${parsed.transactions.length} transactions? This will replace all current data.`)) {
        input.value = '';
        return;
      }
      data.transactions = parsed.transactions || [];
      data.recurring    = parsed.recurring    || [];
      data.customCats   = parsed.customCats   || [];
      data.hiddenCats   = parsed.hiddenCats   || [];
      save();
      render();
      toast(`Imported ${data.transactions.length} transactions`);
    } catch(err) {
      toast('Invalid backup file');
    }
    input.value = '';
  };
  reader.readAsText(file);
}

function deleteRuleFromView(id) {
  if (!confirm('Delete this and all future recurring transactions?')) return;
  const today = todayStr();
  data.transactions = data.transactions.filter(t => !(t.recurringId === id && t.date >= today));
  data.recurring = data.recurring.filter(r => r.id !== id);

// ── Swipe ─────────────────────────────────────────────────────────────────────

function initSwipe(elId, onPrev, onNext) {
  const el = document.getElementById(elId);
  if (!el) return;
  let sx = null, sy = null;
  el.addEventListener('touchstart', e => { sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, { passive: true });
  el.addEventListener('touchend', e => {
    if (sx === null) return;
    const dx = e.changedTouches[0].clientX - sx;
    const dy = Math.abs(e.changedTouches[0].clientY - sy);
    if (Math.abs(dx) > 40 && Math.abs(dx) > dy) { dx > 0 ? onPrev() : onNext(); }
    sx = null;
  }, { passive: true });
}

function initContentSwipe() {
  const el = document.getElementById('content');
  let sx = null, sy = null;
  el.addEventListener('touchstart', e => { sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, { passive: true });
  el.addEventListener('touchend', e => {
    if (sx === null) return;
    const dx = e.changedTouches[0].clientX - sx;
    const dy = Math.abs(e.changedTouches[0].clientY - sy);
    if (Math.abs(dx) > 60 && Math.abs(dx) > dy * 1.5) {
      if (view === 'transactions') { dx > 0 ? prevTx() : nextTx(); }
      else if (view === 'calendar')    { dx > 0 ? prevCal() : nextCal(); }
      else                             { dx > 0 ? prevSt()  : nextSt();  }
    }
    sx = null;
  }, { passive: true });
}
